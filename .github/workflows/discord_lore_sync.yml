name: Among The Stars - Sync Discord lore

on:
  # Runs on GitHub, independently of your home computer. Schedule may be delayed.
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: among-the-stars-discord-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Supabase client
        run: python -m pip install -r requirements.txt
      - name: Sync #ksp-lore to Supabase
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          AGENCY_MAP_JSON: ${{ secrets.AGENCY_MAP_JSON }}
          KSP_LORE_CHANNEL_ID: '1522710127759724736'
          BASELINE_MESSAGE_ID: '1563352404819312710'
        run: python github_sync.py
